{% extends "base.html" %}
{% block content %}

<h2 class="text-center mb-4">资金记录与可视化</h2>



<!-- 图表 -->
<div class="card">
  <div class="card-body">
    <div id="chart" style="width: 100%; height: 60vh; min-height: 350px; max-height: 600px;"></div>
  </div>
</div>

<!-- 账户图表 -->
<!--<div class="card mt-4">
  <div class="card-body">
    <h5>账户资金走势</h5>
    <div id="accountChart" style="height:400px;"></div>
  </div>
</div>-->

<script>
let mainChart;
fetch("{{ url_for('get_data') }}")
  .then(res => res.json())
  .then(data => {
    let chartDom = document.getElementById('chart');
    mainChart = echarts.init(chartDom);

    let users = Object.keys(data);
    let dates = [...new Set([].concat(...users.map(u => data[u].map(v => v.date))))].sort();

    let series = users.map(user => {
      let map = Object.fromEntries(data[user].map(v => [v.date, v.total]));
      return {
        name: user,
        type: 'line',
        data: dates.map(d => map[d] || 0)
      }
    });

    let option = {
      tooltip: { trigger: 'axis' },
      legend: { data: users },
      xAxis: { type: 'category', data: dates },
      yAxis: { type: 'value' },
      series: series
    };

    mainChart.setOption(option);
  });

window.addEventListener('resize', () => {
  if (mainChart) mainChart.resize();
});
fetch("{{ url_for('account_data') }}")
  .then(res => res.json())
  .then(data => {
    let chartDom = document.getElementById('accountChart');
    let myChart = echarts.init(chartDom);

    let accounts = Object.keys(data);
    let dates = [...new Set([].concat(...accounts.map(u => data[u].map(v => v.date))))].sort();

    let series = accounts.map(acc => {
      let map = Object.fromEntries(data[acc].map(v => [v.date, v.amount]));
      return {
        name: acc,
        type: 'line',
        data: dates.map(d => map[d] || 0)
      }
    });

    let option = {
      tooltip: { trigger: 'axis' },
      legend: { data: accounts },
      xAxis: { type: 'category', data: dates },
      yAxis: { type: 'value' },
      series: series
    };

    myChart.setOption(option);
  });
</script>

{% endblock %}
