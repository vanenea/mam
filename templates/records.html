{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">账户记录查询</h3>

<!-- 添加记录表单 -->
<div class="card mb-4">
  <div class="card-body">
    <form method="POST" action="{{ url_for('add_record') }}" class="row g-2">
      <div class="col-md-3">
        <input type="date" class="form-control" name="date" required>
      </div>
      <div class="col-md-2">
        <select class="form-select" name="user" required>
          <option value="CHEN">CHEN</option>
          <option value="DAN">DAN</option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="text" class="form-control" name="account" placeholder="账户名" required>
      </div>
      <div class="col-md-2">
        <input type="number" step="0.01" class="form-control" name="amount" placeholder="金额" required>
      </div>
      <div class="col-md-2 d-grid">
        <button class="btn btn-primary">添加记录</button>
      </div>
    </form>
  </div>
</div>

<form method="get" action="{{ url_for('records_page') }}" class="row g-2 mb-3">
    <div class="col-md-4">
        <input type="date" class="form-control" name="date" value="{{ date }}">
    </div>
    <div class="col-md-2 d-grid">
        <button class="btn btn-primary">查询</button>
    </div>
</form>

<table class="table table-bordered table-sm">
    <thead>
    <tr>
        <th>日期</th>
        <th>用户</th>
        <th>账户</th>
        <th>金额</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    {% for r in records %}
    <tr>
        <form method="POST" action="{{ url_for('update_record') }}">
            <td><input type="text" class="form-control form-control-sm" value="{{ r[1] }}" disabled></td>
            <td><input type="text" name="user" class="form-control form-control-sm" value="{{ r[2] }}"></td>
            <td><input type="text" name="account" class="form-control form-control-sm" value="{{ r[3] }}"></td>
            <td><input type="number" step="0.01" name="amount" class="form-control form-control-sm" value="{{ r[4] }}">
            </td>
            <td>
                <input type="hidden" name="id" value="{{ r[0] }}">
                <button class="btn btn-success btn-sm">保存</button>

        </form>

        <!-- 删除表单 -->
        <form method="POST" action="{{ url_for('delete_record', record_id=r[0]) }}" class="d-inline"
              onsubmit="return confirm('确定要删除这条记录吗？');">
            <button class="btn btn-danger btn-sm">删除</button>
        </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
